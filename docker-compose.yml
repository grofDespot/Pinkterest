services:
  postgres:
    image: postgres:17-alpine
    container_name: pinkterest-postgres
    environment:
      POSTGRES_DB: pinkterest
      POSTGRES_USER: pinkterest
      POSTGRES_PASSWORD: pinkterest
    ports:
      - "5432:5432"
    volumes:
      - pinkterest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinkterest -d pinkterest"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pinkterest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pinkterest
      MINIO_ROOT_PASSWORD: pinkterest123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pinkterest-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:latest
    container_name: pinkterest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pinkterest pinkterest123 &&
      mc mb --ignore-existing local/pinkterest-photos &&
      echo 'bucket ready'
      "

volumes:
  pinkterest-pgdata:
  pinkterest-minio:
